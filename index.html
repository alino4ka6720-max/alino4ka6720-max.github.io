<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кликер: Космическая энергия</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game">
  <header class="hud">
    <div class="stat">
      <div class="stat-label">Баланс</div>
      <div class="stat-value" id="coins">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">В секунду</div>
      <div class="stat-value" id="cps">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Множитель</div>
      <div class="stat-value" id="mult">x1.0</div>
    </div>
  </header>

  <main class="click-area">
    <button id="clickBtn" class="click-btn" aria-label="Кликнуть">
      <span class="click-emoji">⚡</span>
      <span class="click-label">+<span id="clickPower">1</span></span>
    </button>
  </main>

  <section class="shop">
    <h2>Улучшения</h2>
    <div id="shopList"></div>
  </section>

  <section class="prestige">
    <button id="prestigeBtn" disabled>Престиж</button>
    <div class="prestige-info" id="prestigeInfo"></div>
  </section>
</div>

<script src="game.js"></script>
</body>
</html>
